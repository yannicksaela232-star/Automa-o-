name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Extrair o projeto da app
        run: |
          mkdir -p VIPUssd
          unzip -o vipussd-app-v4.zip -d VIPUssd

      - name: Compilar o APK
        working-directory: VIPUssd
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vip-ussd-apk
          path: VIPUssd/app/build/outputs/apk/debug/app-debug.apk
